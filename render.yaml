services:
  - type: web
    name: ayo-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TRUSTED_FRONTEND_ORIGINS
        value: https://archive-of-your-own.onrender.com,https://briz123.github.io
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: "lax"
